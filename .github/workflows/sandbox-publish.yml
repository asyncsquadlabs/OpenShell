name: Publish Kimi Sandbox

on:
  push:
    branches: [main]
    paths:
      - 'sandboxes/kimi/**'
      - '.github/workflows/sandbox-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/asyncsquadlabs/openshell-community/sandboxes/kimi

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-publish-kimi
  cancel-in-progress: false

jobs:
  publish-kimi:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push kimi sandbox image
        uses: docker/build-push-action@v6
        with:
          context: sandboxes/kimi
          file: sandboxes/kimi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
